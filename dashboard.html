function KPIStrip({ txns }) {
  const pending   = txns.filter(t => t.status === 'pending').length;
  const confirmed = txns.filter(t => t.status === 'confirmed' || t.status === 'escalated').length;
  const kpis = [
    { label: 'Transactions Analyzed', value: '6,821',  sub: 'Last 30 days',        icon: '📊', color: 'text-slate-100'   },
    { label: 'Fraud Flagged by ML',   value: '247',    sub: '3.6% fraud rate',     icon: '🚨', color: 'text-red-400'     },
    { label: 'Pending Your Review',   value: pending,  sub: 'Requires attention',   icon: '⏳', color: 'text-amber-400'   },
    { label: 'Actioned (Session)',     value: confirmed,sub: 'Confirmed + escalated',icon: '✅', color: 'text-emerald-400' },
  ];
  return (
    <div className="grid grid-cols-4 gap-4 mb-6">
      {kpis.map(k => (
        <Card key={k.label} className="p-5 flex items-start justify-between">
          <div>
            <p className="text-xs text-slate-500 font-medium">{k.label}</p>
            <p className={`text-3xl font-black mt-1 ${k.color}`}>{k.value}</p>
            <p className="text-[11px] text-slate-600 mt-1">{k.sub}</p>
          </div>
          <span className="text-2xl mt-0.5">{k.icon}</span>
        </Card>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  OVERVIEW TAB
// ═══════════════════════════════════════════════════════════
function OverviewTab({ txns, setTab, setSelected }) {
  const transferFraud = txns.filter(t => t.type === 'TRANSFER' && t.prediction === 1).length;
  const transferTotal = txns.filter(t => t.type === 'TRANSFER').length;
  const cashoutFraud  = txns.filter(t => t.type === 'CASH_OUT'  && t.prediction === 1).length;
  const cashoutTotal  = txns.filter(t => t.type === 'CASH_OUT').length;

  const highRisk = [...txns]
    .filter(t => t.riskScore >= 80 && t.status === 'pending')
    .sort((a, b) => b.riskScore - a.riskScore);

  const buckets = [
    { label: '0–20',  count: txns.filter(t => t.riskScore < 20).length,                     color: 'bg-emerald-500' },
    { label: '20–40', count: txns.filter(t => t.riskScore >= 20 && t.riskScore < 40).length, color: 'bg-emerald-600' },
    { label: '40–60', count: txns.filter(t => t.riskScore >= 40 && t.riskScore < 60).length, color: 'bg-amber-500'   },
    { label: '60–80', count: txns.filter(t => t.riskScore >= 60 && t.riskScore < 80).length, color: 'bg-orange-500'  },
    { label: '80–100',count: txns.filter(t => t.riskScore >= 80).length,                     color: 'bg-red-500'     },
  ];
  const maxBucket = Math.max(...buckets.map(b => b.count), 1);

  return (
    <div className="grid grid-cols-3 gap-6">
      <Card className="col-span-2 p-6">
        <h3 className="text-sm font-semibold text-slate-200">Fraud by Transaction Type</h3>
        <p className="text-xs text-slate-500 mb-5">Fraud vs total transactions in this session</p>
        {[
          { label: 'TRANSFER', fraud: transferFraud, total: transferTotal },
          { label: 'CASH_OUT', fraud: cashoutFraud,  total: cashoutTotal  },
        ].map(d => (
          <div key={d.label} className="mb-5">
            <div className="flex justify-between text-xs mb-1.5">
              <span className="font-semibold text-slate-300">{d.label}</span>
              <span className="text-slate-500">{d.fraud} fraud / {d.total} total</span>
            </div>
            <div className="relative h-5 bg-slate-800 rounded-full overflow-hidden">
              <div className="absolute left-0 h-full bg-slate-700 rounded-full" style={{ width: `${(d.total / txns.length) * 100}%` }} />
              <div className="absolute left-0 h-full bg-red-500 rounded-full" style={{ width: `${(d.fraud / txns.length) * 100}%` }} />
              <div className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 font-semibold">
                {d.total > 0 ? Math.round((d.fraud / d.total) * 100) : 0}% fraud rate
              </div>
            </div>
          </div>
        ))}

        <Separator />

        <h3 className="text-sm font-semibold text-slate-200 mb-1">Risk Score Distribution</h3>
        <p className="text-xs text-slate-500 mb-4">How risky are the transactions in this session?</p>
        <div className="flex items-end gap-2 h-24">
          {buckets.map(b => (
            <div key={b.label} className="flex-1 flex flex-col items-center gap-1">
              <span className="text-xs font-bold text-slate-300">{b.count}</span>
              <div className={`w-full rounded-t transition-all ${b.color}`}
                style={{ height: b.count > 0 ? `${(b.count / maxBucket) * 72}px` : '3px', minHeight: '3px' }} />
              <span className="text-[10px] text-slate-500 text-center leading-tight">{b.label}</span>
            </div>
          ))}
        </div>

        <Separator />

        <div className="grid grid-cols-3 gap-3 text-center">
          {[
            { label: 'Avg Risk Score',   value: Math.round(txns.reduce((s, t) => s + t.riskScore, 0) / txns.length) },
            { label: 'Highest Risk',     value: Math.max(...txns.map(t => t.riskScore)) },
            { label: 'Avg Fraud Amount', value: fmt(txns.filter(t => t.prediction === 1).reduce((s, t) => s + t.amount, 0) / Math.max(txns.filter(t => t.prediction === 1).length, 1)) },
          ].map(s => (
            <div key={s.label} className="bg-slate-800 rounded-lg p-3 border border-slate-700">
              <p className="text-xs text-slate-500">{s.label}</p>
              <p className="text-lg font-bold text-slate-200 mt-0.5">{s.value}</p>
            </div>
          ))}
        </div>
      </Card>

      {/* Alerts sidebar */}
      <Card className="p-5 flex flex-col">
        <h3 className="text-sm font-semibold text-slate-200">🚨 High-Risk Alerts</h3>
        <p className="text-xs text-slate-500 mb-4">Pending investigator review</p>
        <div className="space-y-2.5 flex-1 overflow-y-auto pr-1">
          {highRisk.length === 0
            ? <p className="text-xs text-slate-500 text-center py-8">No pending high-risk cases</p>
            : highRisk.map(t => {
                const rm = riskMeta(t.riskScore);
                return (
                  <div key={t.id}
                    onClick={() => { setSelected(t.id); setTab('investigation'); }}
                    className="flex gap-3 p-3 rounded-lg border border-slate-800 hover:border-slate-600 hover:bg-slate-800 cursor-pointer transition-all group">
                    <div className={`mt-1 w-2 h-2 rounded-full flex-shrink-0 ${rm.dot}`} />
                    <div className="flex-1 min-w-0">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-slate-200">{t.id}</span>
                        <span className={`text-xs font-black ${rm.text}`}>{t.riskScore}</span>
                      </div>
                      <p className="text-[11px] text-slate-500 mt-0.5">{t.type} · {fmt(t.amount)}</p>
                      <p className="text-[10px] text-slate-600">{t.flaggedAt}</p>
                    </div>
                    <span className="text-slate-700 group-hover:text-slate-400 self-center text-sm">›</span>
                  </div>
                );
              })
          }
        </div>
        <Btn variant="outline" size="sm" className="w-full mt-4" onClick={() => setTab('transactions')}>
          View all transactions →
        </Btn>
      </Card>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  TRANSACTIONS TAB
// ═══════════════════════════════════════════════════════════
function TransactionsTab({ txns, selectedId, setSelected, setTab }) {
  const [search, setSearch]   = useState('');
  const [filter, setFilter]   = useState('all');
  const [sortBy, setSortBy]   = useState('riskScore');
  const [sortDir, setSortDir] = useState('desc');

  const filtered = useMemo(() => {
    let rows = txns.filter(t => {
      const q = search.toLowerCase();
      const matchSearch = !q || t.id.toLowerCase().includes(q) || t.type.toLowerCase().includes(q);
      const matchFilter = filter === 'all' || t.status === filter || (filter === 'high' && t.riskScore >= 80);
      return matchSearch && matchFilter;
    });
    return [...rows].sort((a, b) => {
      const v = sortDir === 'asc' ? 1 : -1;
      if (sortBy === 'amount')    return v * (a.amount - b.amount);
      if (sortBy === 'riskScore') return v * (a.riskScore - b.riskScore);
      if (sortBy === 'flaggedAt') return v * a.flaggedAt.localeCompare(b.flaggedAt);
      return 0;
    });
  }, [txns, search, filter, sortBy, sortDir]);

  const toggleSort = col => {
    if (sortBy === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(col); setSortDir('desc'); }
  };

  const SortBtn = ({ col, label }) => (
    <button onClick={() => toggleSort(col)}
      className="flex items-center gap-1 text-xs font-semibold text-slate-500 uppercase tracking-wider hover:text-slate-200">
      {label}
      <span className="text-[10px]">{sortBy === col ? (sortDir === 'desc' ? '↓' : '↑') : '↕'}</span>
    </button>
  );

  return (
    <Card className="overflow-hidden">
      <div className="flex items-center gap-3 p-4 border-b border-slate-800 flex-wrap">
        <input type="text" placeholder="Search by ID or type…" value={search} onChange={e => setSearch(e.target.value)}
          className="flex-1 min-w-48 bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500" />
        <select value={filter} onChange={e => setFilter(e.target.value)}
          className="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-500">
          <option value="all">All Transactions</option>
          <option value="high">High Risk (80+)</option>
          <option value="pending">Pending Review</option>
          <option value="confirmed">Confirmed Fraud</option>
          <option value="escalated">Escalated</option>
          <option value="cleared">Cleared</option>
        </select>
        <span className="text-xs text-slate-500">{filtered.length} results</span>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>

// ═══════════════════════════════════════════════════════════
//  BALANCE FLOW DIAGRAM
// ═══════════════════════════════════════════════════════════
function BalanceFlow({ t }) {
  const senderBad   = t.newbalanceOrig === 0 && t.oldbalanceOrg > 0;
  const receiverBad = t.errorBalanceDest > 0;

  const Box = ({ title, before, after, error, bad }) => (
    <div className={`flex-1 rounded-lg p-4 border ${bad ? 'bg-red-500/10 border-red-900' : 'bg-slate-800 border-slate-700'}`}>
      <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">{title}</p>
      <div className="space-y-1.5">
        <div className="flex justify-between text-xs">
          <span className="text-slate-500">Balance before</span>
          <span className="font-semibold text-slate-300">{fmtFull(before)}</span>
        </div>
        <div className="flex justify-between text-xs">
          <span className="text-slate-500">Balance after</span>
          <span className={`font-semibold ${bad ? 'text-red-400' : 'text-slate-300'}`}>{fmtFull(after)}</span>
        </div>
        {bad && error !== undefined && error > 0 && (
          <div className="mt-2 pt-2 border-t border-red-900">
            <p className="text-[10px] text-red-500 font-semibold">Balance Error</p>
            <p className="text-xs font-bold text-red-400">{fmtFull(error)}</p>
          </div>
        )}
        {bad  && <Badge className="bg-red-500/15 text-red-400 mt-1.5 text-[10px]">⚠ Anomaly detected</Badge>}
        {!bad && <Badge className="bg-emerald-500/15 text-emerald-400 mt-1.5 text-[10px]">✓ Reconciled</Badge>}
      </div>
    </div>
  );

  return (
    <div className="flex items-stretch gap-3 mt-3">
      <Box title="Sender Account" before={t.oldbalanceOrg} after={t.newbalanceOrig}
           error={t.errorBalanceOrig} bad={senderBad} />
      <div className="flex flex-col items-center justify-center gap-1.5 flex-shrink-0 px-1">
        <span className="text-xs font-black text-slate-300">{fmtFull(t.amount)}</span>
        <div className="flex items-center gap-0.5">
          <div className="w-10 h-0.5 bg-slate-600" />
          <div className="border-t-[5px] border-b-[5px] border-l-[8px] border-t-transparent border-b-transparent border-l-slate-600" />
        </div>
        <Badge className="bg-slate-800 text-slate-500 text-[10px] border border-slate-700">{t.type}</Badge>
      </div>
      <Box title="Receiver Account" before={t.oldbalanceDest} after={t.newbalanceDest}
           error={t.errorBalanceDest} bad={receiverBad} />
    </div>
  );
}

  const decide = newStatus => {
    const entry = { action: STATUS[newStatus].label, by: 'You', at: now(), note: notes };
    updateTxn(t.id, { status: newStatus, notes, auditLog: [...t.auditLog, entry] });
    setNotes('');
  };

  const copyReport = () => {

              <p className="text-xs text-slate-600 mt-1">Flagged: {t.flaggedAt}</p>

            <div className="text-center">
              <div className={`text-5xl font-black leading-none ${rm.text}`}>{t.riskScore}</div>
              <div className="text-[10px] text-slate-600 mt-1">/ 100 Risk</div>

            </div>
          </div>

          <div className="grid grid-cols-3 gap-3 mt-4">
            {[
              { label: 'Transaction Amount', val: fmtFull(t.amount),                                highlight: true },
              { label: 'ML Prediction',      val: t.prediction === 1 ? '🚨 FRAUD' : '✅ LEGIT',   highlight: t.prediction === 1 },
              { label: 'Actual Label',        val: t.actual     === 1 ? '🚨 FRAUD' : '✅ LEGIT',   highlight: t.actual === 1 },

          <div dir={showAr ? 'rtl' : 'ltr'}
            className={`rounded-lg p-4 text-sm leading-relaxed border ${reportBox}`}>

        {/* Decision panel */}
        <Card className="p-5">
          <h3 className="text-sm font-semibold text-slate-200">⚖️ Investigator Decision</h3>

          <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3}
            placeholder="Add investigation notes before making a decision (optional)…"
            className="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500 resize-none mb-4" />

          <div className="grid grid-cols-2 gap-3">
            <Btn variant="destructive" size="lg" onClick={() => decide('confirmed')} disabled={t.status === 'confirmed'}>

            <Btn variant="success" size="lg" onClick={() => decide('cleared')} disabled={t.status === 'cleared'}>
              ✅ Mark False Positive
            </Btn>
            <Btn variant="purple" size="lg" onClick={() => decide('escalated')} disabled={t.status === 'escalated'}>
              ⬆ Escalate to Compliance
            </Btn>
            <Btn variant="warning" size="lg" onClick={() => decide('pending')} disabled={t.status === 'pending'}>

        {/* Audit Log */}
        {t.auditLog.length > 0 && (
          <Card className="p-5">
            <h3 className="text-sm font-semibold text-slate-200 mb-3">📋 Audit Trail</h3>
            <div className="space-y-2">
              {[...t.auditLog].reverse().map((log, i) => (
                <div key={i} className="flex gap-3 p-3 bg-slate-800 rounded-lg border border-slate-700">

                    {log.note && <p className="text-xs text-slate-400 mt-1 italic">"{log.note}"</p>}
                  </div>
                </div>
              ))}
            </div>
          </Card>
        )}
      </div>
    </div>
  );
}

            <Badge className="bg-emerald-500/15 text-emerald-400">● Model Active</Badge>
            <Badge className="bg-slate-800 text-slate-400 border border-slate-700">Random Forest · 100 trees</Badge>
            {pending > 0 && <Badge className="bg-amber-500/15 text-amber-400 animate-pulse">{pending} pending</Badge>}
            <span className="text-xs text-slate-600">June 1, 2026</span>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-8 py-6">
        <KPIStrip txns={txns} />

        {/* Tab bar */}
        <div className="flex gap-1 mb-6 bg-slate-900 border border-slate-800 p-1 rounded-lg w-fit">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${tab === t.id ? 'bg-slate-100 text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800'}`}>
              {t.label}
            </button>
          ))}
        </div>

        {tab === 'overview'      && <OverviewTab      txns={txns} setTab={setTab} setSelected={setSelectedId} />}
        {tab === 'transactions'  && <TransactionsTab  txns={txns} selectedId={selectedId} setSelected={setSelectedId} setTab={setTab} />}
        {tab === 'investigation' && <InvestigationTab txns={txns} selectedId={selectedId} setSelectedId={setSelectedId} updateTxn={updateTxn} />}
        {tab === 'model'         && <ModelTab />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
